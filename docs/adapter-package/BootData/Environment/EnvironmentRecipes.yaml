  - id: sketch_centered_rectangle_demo
    display_name: Прямоугольник из центра 100x100
    description: "Рисует прямоугольник 100x100 мм с центром в начале координат (в текущем эскизе — дорисовывает, иначе создаёт эскиз на Front; перед закрытием определяет размеры)"
