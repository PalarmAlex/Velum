    description: "Рисует правильный шестиугольник с центром в начале координат и вписанной окружностью Ø100 (стороны касаются окружности; «под ключ» 100 мм). В текущем эскизе — дорисовывает, иначе создаёт эскиз на Front; перед закрытием определяет размеры"
