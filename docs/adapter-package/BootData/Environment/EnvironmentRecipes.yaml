  - id: sketch_extrude_plate_demo
    display_name: Прямоугольник 100x100
    description: Рисует прямоугольник 100x100 мм (в текущем эскизе — дорисовывает, иначе создаёт эскиз на Front)
    adaptive_action_id: 52
    reactive_eligible: true
    steps:
      - type: invoke
        handler: sketch_extrude_plate
